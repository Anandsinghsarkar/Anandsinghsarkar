<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">Anand Singh Sarkar — Digital Creator</title>
<desc id="desc">Full canvas dark profile card with animated rainbow background waves and professional role title.</desc>
<defs>
 <linearGradient id="spectrum" x1="0%" y1="0%" x2="100%" y2="0%">
  <stop offset="0%" stop-color="#ff3864"><animate attributeName="stop-color" values="#ff3864;#ffad32;#f5ed48;#32d98b;#32c5ff;#9365ff;#ff55bc;#ff3864" dur="12s" repeatCount="indefinite"/></stop>
  <stop offset="50%" stop-color="#32c5ff"><animate attributeName="stop-color" values="#32c5ff;#9365ff;#ff55bc;#ff3864;#ffad32;#f5ed48;#32d98b;#32c5ff" dur="12s" repeatCount="indefinite"/></stop>
  <stop offset="100%" stop-color="#a855f7"><animate attributeName="stop-color" values="#a855f7;#ff55bc;#ff3864;#ffad32;#f5ed48;#32d98b;#32c5ff;#a855f7" dur="12s" repeatCount="indefinite"/></stop>
 </linearGradient>
 <radialGradient id="mist"><stop stop-color="#8b5cf6" stop-opacity=".25"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="42"/></filter>
 </defs>
 <rect width="1200" height="620" fill="#070912"/>
 <rect x="8" y="8" width="1184" height="604" rx="34" fill="#0b1020" stroke="url(#spectrum)" stroke-width="5"/>
 <ellipse cx="170" cy="120" rx="310" ry="210" fill="#8b5cf6" opacity=".18" filter="url(#blur)"/>
 <ellipse cx="1030" cy="510" rx="340" ry="230" fill="#06b6d4" opacity=".16" filter="url(#blur)"/>
 <path d="M0 430 C180 290 330 560 540 420 S900 260 1200 430 L1200 620 L0 620Z" fill="url(#spectrum)" opacity=".13"/>
 <path d="M0 480 C220 350 360 610 620 465 S980 340 1200 470" fill="none" stroke="url(#spectrum)" stroke-width="3" opacity=".65"/>
 <path d="M0 520 C220 390 360 650 620 505 S980 380 1200 510" fill="none" stroke="url(#spectrum)" stroke-width="2" opacity=".38"/>
 <g font-family="Arial,Helvetica,sans-serif" text-anchor="middle">
  <text x="600" y="112" fill="#aab3c5" font-size="19" letter-spacing="8">PERSONAL PROFILE  /  DIGITAL CREATOR</text>
  <text x="600" y="245" fill="#ffffff" font-size="66" font-weight="800" letter-spacing="1">ANAND SINGH SARKAR</text>
  <rect x="170" y="285" width="860" height="4" rx="2" fill="url(#spectrum)"/>
  <text x="600" y="365" fill="#f8fafc" font-size="31" font-weight="700">WEBSITE DESIGNER</text>
  <text x="600" y="415" fill="#f8fafc" font-size="31" font-weight="700">WEB DEVELOPER  •  BOT CREATOR</text>
  <text x="600" y="505" fill="#b8c1d4" font-size="20" letter-spacing="3">DESIGN  •  DEVELOP  •  AUTOMATE  •  CREATE</text>
 </g>
 <circle cx="1080" cy="82" r="10" fill="url(#spectrum)"><animate attributeName="opacity" values="1;.35;1" dur="2s" repeatCount="indefinite"/></circle>
</svg>